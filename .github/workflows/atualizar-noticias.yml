name: Atualizar notícias

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar notícias
        run: node atualizar-noticias.mjs

      - name: Salvar alterações
        run: |
          git config user.name "robo-noticias"
          git config user.email "robo-noticias@users.noreply.github.com"
          git add noticias.json
          git diff --quiet --cached || (git commit -m "Atualiza notícias" && git push)
